<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rare Days Image Resizer</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #fff; --ink: #161616; --muted: #777; --line: #e2e2de;
    --accent: #2f6bff; --good: #1a8a4a; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --panel: #1c1c1c; --ink: #eee; --muted: #8a8a8a; --line: #2c2c2c; --accent: #5b8cff; --good: #3ccf7a; --bad: #ff6b5b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 20px; font-weight: 600; }

  .controls { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .control { display: flex; flex-direction: column; gap: 6px; }
  .control label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .control .val { color: var(--ink); font-weight: 600; text-transform: none; letter-spacing: 0; }
  input[type=range] { width: 220px; accent-color: var(--accent); }
  .ticks { display: flex; justify-content: space-between; width: 220px; font-size: 10px; color: var(--muted); }
  input[type=number] { width: 120px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }

  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 36px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .drop strong { color: var(--ink); }

  .list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .head, .row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 76px 76px 120px 150px 92px 28px; align-items: center; gap: 12px; }
  .head { padding: 0 13px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .head[hidden] { display: none; }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .row img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; background: var(--bg); }
  .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .old { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
  .saved .pct { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .saved.good .pct { color: var(--good); }
  .saved.bad .pct { color: var(--bad); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 5px; overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 3px; background: var(--good); transition: width .25s; }
  .saved.bad .bar span { background: var(--bad); }
  .dims { font-size: 12px; font-variant-numeric: tabular-nums; }
  .dims .from { color: var(--muted); display: block; }
  .dims .to { font-weight: 600; }
  .cell-label { display: none; }
  @media (max-width: 760px) {
    .head { display: none; }
    .row { grid-template-columns: 56px 1fr auto 32px; grid-template-areas: "img name dl x" "stats stats stats stats"; row-gap: 10px; }
    .row img { grid-area: img; } .row .info { grid-area: name; } .row .dl { grid-area: dl; } .row .x { grid-area: x; }
    .row .stats { grid-area: stats; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .cell-label { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  }
  @media (min-width: 761px) { .row .stats { display: contents; } }
  .x { border: none; background: none; color: var(--muted); font-size: 18px; padding: 4px 8px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Rare Days Image Resizer</h1>

  <div class="controls">
    <div class="control">
      <label>Compression <span class="val" id="compVal">20%</span></label>
      <input type="range" id="comp" min="0" max="100" step="10" value="20">
      <div class="ticks"><span>0</span><span>50</span><span>100</span></div>
    </div>
    <div class="control">
      <label>Scale <span class="val" id="scaleVal">100%</span></label>
      <input type="range" id="scale" min="10" max="100" step="10" value="100">
      <div class="ticks"><span>10</span><span>50</span><span>100</span></div>
    </div>
    <div class="spacer"></div>
    <button id="clearAll" disabled>Clear</button>
    <button class="primary" id="dlAll" disabled>Download all</button>
  </div>

  <div class="drop" id="drop">
    <strong>Drop JPEG / PNG files here</strong> or click to choose
    <input type="file" id="file" accept="image/jpeg,image/png" multiple>
  </div>

  <div class="list" id="list">
    <div class="head" id="head" hidden><span></span><span>File</span><span>Original</span><span>WebP</span><span>Saved</span><span>Dimensions</span><span></span><span></span></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const comp = $('comp'), scale = $('scale'), list = $('list');
const items = []; // { file, bitmap, row, blob, url }

const fmt = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
const quality = () => 1 - comp.value / 100;

const toWebp = (bitmap, w, h, q) => {
  const canvas = new OffscreenCanvas(w, h);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, w, h);
  return canvas.convertToBlob({ type: 'image/webp', quality: q });
};

async function encode(item) {
  const gen = item.gen = (item.gen || 0) + 1;
  const s = scale.value / 100;
  const w = Math.max(1, Math.round(item.bitmap.width * s));
  const h = Math.max(1, Math.round(item.bitmap.height * s));
  const blob = await toWebp(item.bitmap, w, h, quality());
  if (gen !== item.gen) return;
  if (item.url) URL.revokeObjectURL(item.url);
  item.blob = blob;
  item.url = URL.createObjectURL(blob);
  item.dims = [w, h];
  render(item);
}

function render(item) {
  const { row, file, blob, dims } = item;
  row.querySelector('img').src = item.url;
  const pct = Math.round((1 - blob.size / file.size) * 100);
  const cls = pct >= 0 ? 'good' : 'bad';
  const ratio = Math.min(1, blob.size / file.size);
  const [ow, oh] = [item.bitmap.width, item.bitmap.height];
  const saved = row.querySelector('.saved');
  saved.className = 'saved ' + cls;
  saved.querySelector('.pct').textContent = (pct >= 0 ? '−' : '+') + Math.abs(pct) + '%';
  saved.querySelector('.bar span').style.width = (pct >= 0 ? (1 - ratio) * 100 : 100) + '%';
  row.querySelector('.osize').textContent = fmt(file.size);
  row.querySelector('.nsize').textContent = fmt(blob.size);
  row.querySelector('.dims').innerHTML = ow === dims[0]
    ? `<span class="to">${ow}×${oh}</span>`
    : `<span class="from">${ow}×${oh}</span><span class="to">→ ${dims[0]}×${dims[1]}</span>`;
  row.querySelector('.note').textContent = '';
  row.querySelector('.dl').disabled = false;
}

const outName = f => f.name.replace(/\.(jpe?g|png)$/i, '') + '.webp';

function download(item) {
  const a = document.createElement('a');
  a.href = item.url;
  a.download = outName(item.file);
  a.click();
}

async function addFiles(files) {
  for (const file of files) {
    if (!/^image\/(jpeg|png)$/.test(file.type)) continue;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<img alt=""><div class="info"><div class="name"></div><div class="note">Converting…</div></div>
      <div class="stats">
        <div><span class="cell-label">Original</span><span class="num old osize">${fmt(file.size)}</span></div>
        <div><span class="cell-label">WebP</span><span class="num nsize">—</span></div>
        <div><span class="cell-label">Saved</span><div class="saved"><span class="pct">—</span><div class="bar"><span style="width:0"></span></div></div></div>
        <div><span class="cell-label">Dimensions</span><div class="dims">—</div></div>
      </div>
      <button class="dl" disabled>Download</button><button class="x" title="Remove">×</button>`;
    row.querySelector('.name').textContent = outName(file);
    list.appendChild(row);
    const item = { file, row };
    items.push(item);
    row.querySelector('.dl').onclick = () => download(item);
    row.querySelector('.x').onclick = () => remove(item);
    updateButtons();
    try {
      item.bitmap = await createImageBitmap(file);
      await encode(item);
    } catch (e) {
      row.querySelector('.note').textContent = 'Could not read this image (it may be too large for the browser).';
    }
  }
}

function remove(item) {
  if (item.url) URL.revokeObjectURL(item.url);
  item.bitmap?.close();
  item.row.remove();
  items.splice(items.indexOf(item), 1);
  updateButtons();
}

function updateButtons() {
  $('dlAll').disabled = $('clearAll').disabled = !items.length;
  $('head').hidden = !items.length;
}

let pending;
function reencodeAll() {
  clearTimeout(pending);
  pending = setTimeout(() => items.filter(i => i.bitmap).forEach(encode), 150);
}

comp.oninput = () => { $('compVal').textContent = comp.value + '%'; reencodeAll(); };
scale.oninput = () => { $('scaleVal').textContent = scale.value + '%'; reencodeAll(); };

$('dlAll').onclick = async () => {
  for (const i of items.filter(i => i.blob)) { download(i); await new Promise(r => setTimeout(r, 200)); }
};
$('clearAll').onclick = () => [...items].forEach(remove);

const drop = $('drop'), input = $('file');
drop.onclick = () => input.click();
input.onchange = () => { addFiles([...input.files]); input.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files]); };
</script>
</body>
</html>
